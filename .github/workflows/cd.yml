name: STRling CD
permissions:
    contents: read
jobs:
    release-certification:
        name: Verify preserved closed reference certification
        runs-on: ubuntu-latest
        if:
            ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event_name ==
            'workflow_run' && github.event.workflow_run.conclusion == 'success') }}
        steps:
            - name: Checkout trusted verifier
              uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
              with:
                  persist-credentials: false
                  fetch-depth: 0
                  ref: dd9d7702237ba9c56e1269418d5a9bd5b582b9f0
                  path: trusted
            - name: Checkout closed reference evidence as data
              uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
              with:
                  persist-credentials: false
                  ref: 2d8d897504663211d3768517f0be9f0e28d0f11e
                  fetch-depth: 0
                  path: candidate
            - name: Install Python
              uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
              with:
                  python-version: "3.12"
            - name: Install verification dependency
              run: python -m pip install jsonschema==4.10.3 PyYAML==6.0.1
            - name: Verify signed local Release evidence
              shell: bash
              run:
                  "mkdir -p artifacts\npython -I trusted/tooling/local_certification_attestation.py \\\n  --repository-root\
                  \ candidate \\\n  --trust-root trusted \\\n  verify \\\n  --bundle candidate/tests/certification/hardened-core/1.0/current\
                  \ \\\n  --json | tee artifacts/cloud-certification-verification.json\n"
            - name: Retain release certification evidence
              if: ${{ always() }}
              continue-on-error: true
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
              with:
                  name: certification-verification-${{ github.run_id }}
                  path: artifacts/cloud-certification-verification.json
                  if-no-files-found: warn
                  retention-days: 90
    verify-release:
        name: Verify Release Conditions
        needs: release-certification
        runs-on: ubuntu-latest
        if:
            ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event_name ==
            'workflow_run' && github.event.workflow_run.conclusion == 'success') }}
        outputs:
            is_release: ${{ steps.release_state.outputs.is_release }}
            tag_version: ${{ steps.release_state.outputs.tag_version }}
            version: ${{ steps.release_state.outputs.version }}
            is_dry_run: ${{ steps.release_state.outputs.is_dry_run }}
            release_ref: ${{ steps.release_state.outputs.release_ref }}
        steps:
            - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
              with:
                  persist-credentials: false
                  fetch-depth: 0
                  ref: ${{ inputs.source_sha || github.event.workflow_run.head_sha || github.sha }}
            - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
              with:
                  python-version: "3.12"
            - run: python -m pip install jsonschema==4.10.3 PyYAML==6.0.1
            - name: Check canonical product policy and exact source
              id: release_state
              env:
                  REQUESTED_DRY_RUN: ${{ inputs.dry_run }}
                  EVENT_NAME: ${{ github.event_name }}
                  PUBLICATION_ENABLED: ${{ vars.RELEASE_PUBLICATION_ENABLED }}
              run:
                  "python tooling/sync_versions.py --check\npython tooling/release_policy.py --check\npython - <<'PY'\n\
                  import json, os, subprocess\nfrom pathlib import Path\nversion = json.loads(Path('governance/release-policy.json').read_text())['product']['version']\n\
                  source = subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()\ndry = not (os.environ['PUBLICATION_ENABLED']\
                  \ == 'true' and (os.environ['REQUESTED_DRY_RUN'] == 'false' or os.environ['EVENT_NAME'] == 'push'))\n\
                  with open(os.environ['GITHUB_OUTPUT'],'a') as output:\n    output.write(f'version={version}\\ntag_version={version}\\\
                  nrelease_ref={source}\\nis_release=true\\nis_dry_run={str(dry).lower()}\\n')\nPY"
    compile-c:
        needs: verify-release
        if: needs.verify-release.outputs.is_dry_run == 'true'
        runs-on: ${{ matrix.runner }}
        steps:
            - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
              with:
                  ref: ${{ needs.verify-release.outputs.release_ref }}
                  persist-credentials: false
                  fetch-depth: 0
            - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
              with:
                  python-version: "3.12"
            - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
              with:
                  toolchain: 1.75.0
            - name: Checkout reproducibility source
              uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
              with:
                  ref: ${{ needs.verify-release.outputs.release_ref }}
                  persist-credentials: false
                  fetch-depth: 0
                  path: .rebuild
            - name: Isolate disposable build outputs
              run: printf '/.rebuild/\n/artifacts/\n/.cert/\n' >> .git/info/exclude
            - name: Prepare governed build dependencies
              run:
                  "python -m pip install --requirement tooling/requirements-quality.txt

                  cargo +1.75.0 fetch --manifest-path bindings/interop/Cargo.toml --locked"
            - name: Install bounded CMake SDK
              run: python -m pip install cmake==3.31.10
            - name: Assemble first clean source
              working-directory: .
              run: python -m tooling.release_packaging --artifact-id release:c
            - name: Capture first build and isolated consumer
              run:
                  python -m tooling.release_supply_chain capture --artifact-id release:c --version "${{ needs.verify-release.outputs.version
                  }}" --source-root . --output-dir artifacts/build-receipts/c-${{ matrix.scope }}-first.json --json
            - name: Stage exact first file graph
              run:
                  python -m tooling.release_supply_chain prepare-upload --source-root . --receipt artifacts/build-receipts/c-${{
                  matrix.scope }}-first.json --output-dir .cert/uploads/c-${{ matrix.scope }}-first --json
            - name: Retain exact first artifact
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
              with:
                  name: release-c-${{ matrix.scope }}-${{ needs.verify-release.outputs.release_ref }}
                  path: .cert/uploads/c-${{ matrix.scope }}-first
                  include-hidden-files: true
                  if-no-files-found: error
                  retention-days: 7
            - name: Assemble second clean source
              working-directory: .rebuild
              run: python -m tooling.release_packaging --artifact-id release:c
            - name: Capture second build and isolated consumer
              run:
                  python -m tooling.release_supply_chain capture --artifact-id release:c --version "${{ needs.verify-release.outputs.version
                  }}" --source-root .rebuild --output-dir artifacts/build-receipts/c-${{ matrix.scope }}-second.json
                  --json
            - name: Stage exact second file graph
              run:
                  python -m tooling.release_supply_chain prepare-upload --source-root .rebuild --receipt artifacts/build-receipts/c-${{
                  matrix.scope }}-second.json --output-dir .cert/uploads/c-${{ matrix.scope }}-second --json
            - name: Retain exact second artifact
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
              with:
                  name: rebuild-c-${{ matrix.scope }}-${{ needs.verify-release.outputs.release_ref }}
                  path: .cert/uploads/c-${{ matrix.scope }}-second
                  include-hidden-files: true
                  if-no-files-found: error
                  retention-days: 7
            - name: Retain authenticated build receipts
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
              with:
                  name: release-build-receipt-c-${{ matrix.scope }}-${{ needs.verify-release.outputs.release_ref }}
                  path:
                      "artifacts/build-receipts/c-${{ matrix.scope }}-first.json

                      artifacts/build-receipts/c-${{ matrix.scope }}-second.json"
                  if-no-files-found: error
                  retention-days: 7
        permissions:
            contents: read
        strategy:
            fail-fast: false
            matrix:
                include:
                    - scope: windows-x86_64
                      runner: windows-2022
                    - scope: linux-x86_64
                      runner: ubuntu-24.04
        defaults:
            run:
                shell: bash
    compile-cpp:
