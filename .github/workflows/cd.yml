                  registry-url: https://registry.npmjs.org
            - name: Install pinned npm trusted-publishing client
              run:
                  npm install --global --ignore-scripts npm@11.5.1 --registry=https://registry.npmjs.org --userconfig=/dev/null
                  --globalconfig=/dev/null
            - name: Upload only the approved subject
              env: {}
              run:
                  python -I .cert/publisher/tooling/publish_certified_artifact.py --execute --artifact-id release:typescript
                  --source-root candidate --trust-root .cert/publisher --certification-bundle .cert/certification
                  --evidence .cert/certification/evidence/release-supply-chain/release-supply-chain-evidence.json
                  --authorization .cert/authorization.json --receipt .cert/receipts/typescript.json --certification-root
                  .cert/closure
            - name: Retain registry receipt for independent verification
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
              if: ${{ always() }}
              with:
                  name: publication-receipt-typescript-${{ github.run_id }}-${{ github.run_attempt }}
                  path: .cert/receipts
                  if-no-files-found: warn
                  retention-days: 90
        env:
            RELEASE_APPROVED_WORKFLOW_SHA: ${{ vars.RELEASE_APPROVED_WORKFLOW_SHA }}
            RELEASE_AUTHORIZATION_SHA256: ${{ vars.RELEASE_AUTHORIZATION_SHA256 }}
            RELEASE_ENVIRONMENT: release
            RELEASE_DRY_RUN: ${{ needs.verify-release.outputs.is_dry_run }}
            RELEASE_CERTIFIED_RUN_ID: ${{ inputs.certified_run_id || vars.RELEASE_CERTIFIED_RUN_ID }}
            RELEASE_CERTIFICATION_REF: ${{ vars.RELEASE_CERTIFICATION_REF }}
    attest-release-subjects:
        needs:
            - verify-release
            - release-certification
        runs-on: ubuntu-24.04
        if:
            ${{ needs.verify-release.outputs.is_dry_run == 'false' && vars.RELEASE_PUBLICATION_ENABLED == 'true'
            && github.workflow_sha == vars.RELEASE_APPROVED_WORKFLOW_SHA && github.run_id == vars.RELEASE_AUTHORIZED_RUN_ID
            && github.run_attempt == vars.RELEASE_AUTHORIZED_RUN_ATTEMPT }}
        environment: release-attestation
        permissions:
            contents: read
            id-token: write
            attestations: write
            artifact-metadata: write
            actions: read
        steps:
            - name: Checkout approved subject verifier
              uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
              with:
                  ref: ${{ vars.RELEASE_APPROVED_WORKFLOW_SHA }}
                  path: .cert/publisher
                  persist-credentials: false
                  fetch-depth: 0
            - name: Checkout certified source as data
              uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
              with:
                  ref: ${{ needs.verify-release.outputs.release_ref }}
                  path: candidate
                  persist-credentials: false
                  fetch-depth: 0
            - name: Checkout evidence closure as data
              uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
              with:
                  ref: ${{ vars.RELEASE_CERTIFICATION_REF }}
                  path: .cert/closure
                  persist-credentials: false
                  fetch-depth: 0
            - name: Download signed certification
              uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
              with:
                  name: signed-release-${{ needs.verify-release.outputs.release_ref }}
                  path: .cert/certification
                  repository: strling-lang/strling
                  run-id: ${{ inputs.certified_run_id || vars.RELEASE_CERTIFIED_RUN_ID }}
                  github-token: ${{ github.token }}
            - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
              with:
                  python-version: "3.12"
            - name: Install pinned verification runtime
              run: python -m pip install jsonschema==4.10.3 PyYAML==6.0.1
            - name: Authenticate signed subjects before remote attestation
              run:
                  python -I .cert/publisher/tooling/release_supply_chain.py certified-checksums --source-root candidate
                  --trust-root .cert/publisher --certification-root .cert/closure --certification-bundle .cert/certification
                  --evidence .cert/certification/evidence/release-supply-chain/release-supply-chain-evidence.json
                  --output-dir .cert/subjects.sha256 --json
            - name: Attest the exact signed subject identities
              uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d
              with:
                  subject-checksums: .cert/subjects.sha256
"on":
    workflow_run:
        workflows:
            - STRling CI
        branches:
            - main
        types:
            - completed
    workflow_dispatch:
        inputs:
            dry_run:
                description: Run deployment in dry-run mode
                required: true
                default: true
                type: boolean
            source_sha:
                description: Exact certified source SHA (empty uses event SHA)
                required: false
                default: ""
                type: string
            certified_run_id:
                description: Run retaining the exact signed bundle and certified package bytes
                required: false
                default: ""
                type: string
            publication_authorization:
                description: Owner approval JSON; protected digest and reviewed workflow are required separately
                required: false
                default: ""
                type: string
    push:
        tags:
            - v*
