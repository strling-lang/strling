    certify-release-supply-chain:
        name: Certify exact release artifact handoff
        needs:
            - verify-release
            - compile-c
            - compile-cpp
            - compile-csharp
            - compile-dart
            - compile-fsharp
            - compile-go
            - compile-java
            - compile-kotlin
            - compile-lua
            - compile-perl
            - compile-php
            - compile-python
            - compile-r
            - compile-ruby
            - compile-rust
            - compile-swift
            - compile-typescript
        if: needs.verify-release.outputs.is_dry_run == 'true'
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - name: Checkout certified source
              uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
              with:
                  persist-credentials: false
                  ref: ${{ needs.verify-release.outputs.release_ref }}
                  fetch-depth: 0
            - name: Checkout first authenticated build source
              uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
              with:
                  persist-credentials: false
                  ref: ${{ needs.verify-release.outputs.release_ref }}
                  fetch-depth: 0
                  path: .cert/first
            - name: Checkout second authenticated build source
              uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
              with:
                  persist-credentials: false
                  ref: ${{ needs.verify-release.outputs.release_ref }}
                  fetch-depth: 0
                  path: .cert/second
            - name: Restore exact first-build subjects
              uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
              with:
                  pattern: release-*-${{ needs.verify-release.outputs.release_ref }}
                  path: .cert/downloads
            - name: Restore exact rebuild subjects
              uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
              with:
                  pattern: rebuild-*-${{ needs.verify-release.outputs.release_ref }}
                  path: .cert/downloads
            - name: Restore authenticated build receipts
              uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
              with:
                  pattern: release-build-receipt-*-${{ needs.verify-release.outputs.release_ref }}
                  path: .cert/receipts
                  merge-multiple: true
            - name: Install governed certification runtime
              uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
              with:
                  python-version: "3.12"
            - name: Install governed Rust security runtime
              uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
              with:
                  toolchain: stable
            - name: Authenticate scanner and exact artifact handoff
              env:
                  STRLING_OSV_SCANNER: ${{ github.workspace }}/.cert/tools/osv-scanner
              run:
                  'python -m pip install --requirement tooling/requirements-quality.txt

                  cargo install cargo-audit --version 0.22.2 --locked

                  mkdir -p .cert/tools

                  curl --fail --location --output "$STRLING_OSV_SCANNER" https://github.com/google/osv-scanner/releases/download/v2.4.0/osv-scanner_linux_amd64

                  echo "15314940c10d26af9c6649f150b8a47c1262e8fc7e17b1d1029b0e479e8ed8a0  $STRLING_OSV_SCANNER" |
                  sha256sum --check

                  chmod 0755 "$STRLING_OSV_SCANNER"

                  python -m tooling.release_supply_chain check --json

                  python -m tooling.release_supply_chain security --risk-evidence artifacts/release-risk.json --json

                  python -m tooling.release_supply_chain stage --source-root . --download-root .cert/downloads --build-receipt-dir
                  .cert/receipts --first-root .cert/first --second-root .cert/second --release-ref "${{ needs.verify-release.outputs.release_ref
                  }}" --json

                  python -m tooling.release_supply_chain produce --profile release --version "${{ needs.verify-release.outputs.version
                  }}" --source-root .cert/first --second-root .cert/second --output-dir artifacts/release-supply-chain
                  --risk-evidence artifacts/release-risk.json --build-receipt-dir .cert/receipts --json

                  python -m tooling.release_supply_chain verify --source-root .cert/first --evidence artifacts/release-supply-chain/release-supply-chain-evidence.json
                  --json

                  mkdir -p artifacts

                  grep -h -v ''^#'' artifacts/release-supply-chain/checksums/*.sha256 | LC_ALL=C sort > artifacts/release-subjects.sha256

                  '
            - name: Retain certification subjects
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
              with:
                  name: release-supply-chain-${{ needs.verify-release.outputs.release_ref }}
                  path: "artifacts/release-subjects.sha256

                      artifacts/release-supply-chain

                      artifacts/release-risk.json

                      "
                  if-no-files-found: error
                  retention-days: 90
    publish-c:
        needs:
            - verify-release
            - release-certification
        if:
            ${{ needs.verify-release.outputs.is_release == 'true' && needs.verify-release.outputs.is_dry_run ==
            'false' && vars.RELEASE_PUBLICATION_ENABLED == 'true' && github.workflow_sha == vars.RELEASE_APPROVED_WORKFLOW_SHA
            && github.repository == 'strling-lang/strling' && (github.event_name == 'workflow_dispatch' || github.event_name
            == 'push') && contains(fromJSON(vars.RELEASE_AUTHORIZED_DESTINATIONS || '[]'), 'release:c') && github.run_id
            == vars.RELEASE_AUTHORIZED_RUN_ID && github.run_attempt == vars.RELEASE_AUTHORIZED_RUN_ATTEMPT }}
        runs-on: ubuntu-24.04
        environment: release
        steps:
            - name: Checkout approved publisher only
              uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
              with:
                  ref: ${{ vars.RELEASE_APPROVED_WORKFLOW_SHA }}
                  path: .cert/publisher
                  persist-credentials: false
                  fetch-depth: 0
            - name: Checkout certified source as data
              uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
              with:
                  ref: ${{ needs.verify-release.outputs.release_ref }}
                  path: candidate
                  persist-credentials: false
                  fetch-depth: 0
            - name: Checkout certification closure as data
              uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
              with:
                  ref: ${{ vars.RELEASE_CERTIFICATION_REF }}
                  path: .cert/closure
                  persist-credentials: false
                  fetch-depth: 0
            - name: Restore exact certified package upload
              uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
              with:
                  name: certified-c-${{ needs.verify-release.outputs.release_ref }}
                  path: .cert/downloads/c
                  repository: strling-lang/strling
                  run-id: ${{ inputs.certified_run_id || vars.RELEASE_CERTIFIED_RUN_ID }}
                  github-token: ${{ github.token }}
            - name: Restore signed artifact and certification root
              uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
              with:
                  name: signed-release-${{ needs.verify-release.outputs.release_ref }}
                  path: .cert/certification
                  repository: strling-lang/strling
                  run-id: ${{ inputs.certified_run_id || vars.RELEASE_CERTIFIED_RUN_ID }}
                  github-token: ${{ github.token }}
            - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
              with:
                  python-version: "3.12"
            - name: Install trusted verification dependencies
              run: python -m pip install jsonschema==4.10.3 PyYAML==6.0.1
            - name: Read approval document as data
              env:
                  APPROVAL_JSON: ${{ vars.RELEASE_AUTHORIZATION_JSON || inputs.publication_authorization }}
              run: "python - <<'PY'

                  import os

                  from pathlib import Path

                  Path('.cert/authorization.json').write_text(os.environ['APPROVAL_JSON'],encoding='utf-8')

                  PY"
            - name: Authenticate exact approved handoff
              run:
                  python -I .cert/publisher/tooling/release_supply_chain.py handoff --artifact-id release:c --source-root
                  candidate --trust-root .cert/publisher --certification-bundle .cert/certification --evidence .cert/certification/evidence/release-supply-chain/release-supply-chain-evidence.json
                  --authorization .cert/authorization.json --download-root .cert/downloads/c --json --certification-root
                  .cert/closure --output-dir .cert/receipts/handoff-intent.json
            - name: Upload only the approved subject
              env:
                  GITHUB_TOKEN: ${{ github.token }}
              run:
                  python -I .cert/publisher/tooling/publish_certified_artifact.py --execute --artifact-id release:c
                  --source-root candidate --trust-root .cert/publisher --certification-bundle .cert/certification
                  --evidence .cert/certification/evidence/release-supply-chain/release-supply-chain-evidence.json
                  --authorization .cert/authorization.json --receipt .cert/receipts/c.json --certification-root .cert/closure
            - name: Retain registry receipt for independent verification
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
              if: ${{ always() }}
              with:
                  name: publication-receipt-c-${{ github.run_id }}-${{ github.run_attempt }}
                  path: .cert/receipts
                  if-no-files-found: warn
                  retention-days: 90
        permissions:
            contents: write
            actions: read
        env:
            RELEASE_APPROVED_WORKFLOW_SHA: ${{ vars.RELEASE_APPROVED_WORKFLOW_SHA }}
            RELEASE_AUTHORIZATION_SHA256: ${{ vars.RELEASE_AUTHORIZATION_SHA256 }}
            RELEASE_ENVIRONMENT: release
            RELEASE_DRY_RUN: ${{ needs.verify-release.outputs.is_dry_run }}
            RELEASE_CERTIFIED_RUN_ID: ${{ inputs.certified_run_id || vars.RELEASE_CERTIFIED_RUN_ID }}
            RELEASE_CERTIFICATION_REF: ${{ vars.RELEASE_CERTIFICATION_REF }}
