record_version: 2.0.0
title: Bounded whole-input language relations review
status: in_progress
objective: Admit the private compiler-owned, analysis-only comparison tool and verify its declared whole-input scalar model before integrating the source. Any public product interface, broader semantics, or rewrite authorization has a separate approval scope.
