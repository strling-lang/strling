title: Final product candidate preparation and clean-room certification
status: in_progress
objective:
    Prepare accurate product, migration, architecture, example and support documentation; repair
    confirmed host source-helper defaults; independently certify one reproducible complete product candidate
    without publication.
required_verification:
    - name: Focused source-helper and documentation regressions
      command: python3 -m pytest -q tooling/tests/test_documentation_integrity.py
      expected_result:
          Source-backed examples and scope assertions reject drift; canonical source frontends
          remain authoritative.
    - name: Fresh complete-product certification
      command: python3 tooling/production_certification.py --profile release --all --no-reuse --plain
      expected_result:
          Fresh current-source Local, Pull Request, Full and independent no-reuse Release, staged
          builds/consumers, independent reconstruction, restricted signing and hosted verification all pass.
