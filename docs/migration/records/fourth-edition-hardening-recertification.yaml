            details: The versioned trust registry authorizes one Ed25519 SSHSIG certifier without storing private material. The attestation binds exact Git commit and tree, clean-source state, profile and operation registries, kernel and interop identities, target-profile fingerprints, runtimes, invocations, waivers, samples, real-engine evidence, and every durable evidence-file SHA-256 beneath one deterministic root.
          - check: Anti-replay and integrity tests
            command: python3 -m unittest tooling.tests.test_local_certification_attestation -v
            result: passed
            details: Fourteen focused tests reject stale source, altered or missing evidence, wrong profile identity, stale replay, untrusted or malformed signatures, contradictory aggregates, changed sample and real-engine evidence, waiver mutation, wrong invocation, and nondeterministic roots.
          - check: Cloud verification boundary
            result: passed
            details: The trusted-base verifier treats the candidate checkout only as data, independently recomputes inexpensive contract and evidence identities, rejects any non-closure source change, and does not execute Pull Request, Full, Release, governed performance sampling, exact-engine corpus work, or the multi-language matrix. The canonical local Pull Request profile retains its H06 exact-engine operation.
          - check: Pre-sample Full environment result
            result: passed
            details: The 9f85a00c Full attempt stopped at the unchanged native quiet-host precondition with zero started coordinates and zero authenticated samples. The result is preserved as environmental evidence and did not consume a governed sampled attempt.
          - check: Candidate c3081cc2 pre-sample prerequisite audit
            result: passed
            details: The sole c3081cc2 Full attempt completed 122 operations, then failed two deterministic prerequisites and reported one performance environment unavailable before starting any governed coordinate or authenticating any sample. The preserved artifact identified newly published npm advisories, missing JUnit BOM license metadata, a Windows-generated Perl Makefile consumed by WSL, and Windows build identity drift from 26200.9278 to 26200.9445. The npm locks, exact scoped BOM metadata, and WSL-local Perl generation were corrected; the sampled attempt remains unconsumed because coordinates_started and authenticated_sample_count were both zero.
