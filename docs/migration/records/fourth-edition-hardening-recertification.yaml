change_classification:
    semantic_change:
        level: none
        evidence: []
    public_api_change:
        level: additive
        evidence:
            - The engineering root CLI gains the certification attest, verify, and contract command family; existing product and binding commands are unchanged.
        affected_surfaces:
            - root-cli
    schema_change:
        level: compatible
        evidence:
            - Governance-only schemas define the trusted local certification policy and signed evidence bundle; no language or product protocol schema changes.
            - Empty captured stdout/stderr files are valid only for execution evidence stream roles; all structured evidence remains nonempty and hash-bound.
            - The performance evidence schema compatibly admits an optional paired same-binary launch-control model, including authenticated control arrays, ratio statistics, and preserved raw diagnostic history; direct measurements remain unchanged.
    diagnostic_change:
        level: none
        evidence: []
        affected_surfaces: []
    target_behavior_change:
        level: compatible
        evidence:
            - Capability and portability results are unchanged; the immutable profile-set path reuses the same validated canonical profile reference instead of deriving it again during each stage, with direct-versus-reference equality covered by focused tests.
            - Post-lowering requirement evaluation consumes the exact profile reference already checked by the lowering entry point; supported, constrained, unknown, and refusal dispositions remain unchanged.
        affected_surfaces:
            - capability-evaluation
            - portability-planning
            - target-lowering
    architecture_change:
        level: compatible
        evidence:
            - Public-contract extraction closes stdin for every noninteractive tool and gives only the Kotlin Gradle classes step a five-minute bound; a timeout preserves both output streams and terminates the exact client/daemon descendant tree, while contract membership, snapshots, build inputs, and profile-level timeouts remain unchanged.
            - Environment version probes close stdin, use the governed 30-second probe-only timeout, and preserve captured stdout and stderr diagnostics; build, test, and certification operation timeouts remain unchanged, and the correction addresses a deterministic qualification hang rather than product semantics.
            - Pull Request qualification now validates the exact-runtime handoff and governed JVM dependency repository before its first registered operation; Maven remains offline and is explicitly bound to the declared repository, while profile membership, operation timeouts, thresholds, sampling, and product semantics remain unchanged.
            - The enforced generated-family check is restored to the Local/Pull Request offline contract while network-authenticated regeneration remains unchanged.
            - Full and Release remain the unchanged expensive result authorities but execute locally; cloud workflows verify a trusted exact-source attestation instead of recomputing them.
            - The attestation CLI is registered as a reviewed engineering-only tooling parser path; it cannot parse or define STRling language semantics.
            - Windows CLI startup certification compares authenticated request latency with a same-executable help-launch control under the same accepted conditioning window; derived relative and absolute ratio limits remain hard gates, raw nanoseconds remain diagnostic evidence, and the prior raw ceiling is retained as history.
            - CLI request and same-binary control samples are adjacent and alternate execution order after equal warmup, preventing block-order host drift while preserving both workloads, sample counts, affinity, timer, conditioning, and stability limits.
            - If Windows changes build during the one-time CLI migration, the combined governed rollover recalibrates every performance coordinate, permits only that reviewed CLI comparison-model change, and requires every non-CLI coordinate to pass the prior contract before replacing authority.
            - A native processor-counter epoch discontinuity is reacquired only when it matches the exact existing unavailable report; malformed, identity, power, busy, and interrupt failures remain fail closed under the unchanged conditioning thresholds.
            - New baseline calibration authenticates and retains a quiet conditioning snapshot immediately before every coordinate in every repetition, matching Full and Release and preventing a long repetition from carrying an earlier quiet observation across later host drift.
            - After a measured Full regression exposed repeated validation and canonical hashing of the same immutable profile in capability evaluation and planning, the existing TargetProfileSet boundary now caches its validated reference and provides equivalent fail-closed reference-based planning; post-lowering evaluation reuses the exact reference already validated by each lowering entry point.
            - Direct target lowering reuses private, exact planner and Semantic IR snapshots on the unchanged success path, falls back to full validation and canonical hashing for any caller-mutated input, and defers target-tree diagnostic path construction to failures; public contracts, calibrated benchmark workloads, validation outcomes, target semantics, and governed performance budgets remain unchanged.
            - >-
                Deep-quality profile commands now preserve their declared structured-result contract when deterministic manifest validation fails: the manifest check is reported as failed JSON with the original error code and reason instead of raising before emitting a result.
            - >-
                The governed Perl build owns its generated Makefile: it regenerates the Makefile from the tracked Makefile.PL before invoking make, so a clean checkout and any Perl toolchain change build correctly on the first invocation. Dependency resolution, the declared tool set, the executed build, lint, and test commands, and every certification threshold remain unchanged; no retry, ignored exit code, or relaxed result is introduced.
            - >-
                The C adapter declares its canonical interop dependencies without recursively globbing Cargo build trees: exact manifest and lock inputs, including the interop workspace fuzz member, are named directly while recursive globbing stays limited to source directories. The dependency set, the built artifacts, and the sanitizer isolation boundary are unchanged; only the repeated configure-time and build-time directory traversal is removed.
            - >-
                The canonical interop bridge decodes strict valid compile envelopes directly into the governed request and optional target-profile types, while every malformed or nonmatching request continues through the existing closed dispatcher with unchanged error identities. Successful responses reserve an 8 KiB initial buffer capped by the existing response limit. Protocol fields, kernel semantics, performance ceilings, sample counts, placement, and conditioning remain unchanged.
            - >-
                Safety analysis derives the exact semantic identity and reachable-node set once per invocation and reuses that context across foundational, structural, and result-evidence correspondence checks. Standalone validation entry points still derive their own context, and no validation, semantic result, performance workload, sample count, conditioning rule, baseline, or acceptance ceiling changes.
            - >-
                Forbidden-dependency architecture rules enumerate only their declared source patterns instead of recursively traversing the complete workspace before filtering. Tracked and untracked matching sources remain covered, while ignored build trees and caches outside every declared pattern are excluded from filesystem traversal.
    generated_output_change:
        level: compatible
        evidence:
            - The registered dependency-license producer reproduces the existing 54-entry fingerprint exactly; only its check path changes from live reconstruction to fail-closed lock and fingerprint validation.
            - Registered profile-source definitions are refreshed for the strengthened profile identities, and the root CLI snapshot records the additive certification command.
            - Semantic-authority retirement evidence is regenerated because the governed profile and CI authority graph changed while canonical semantics and retired-history boundaries remain unchanged.
            - The deep-quality governed source-identity refresh following intentional source changes from the Windows performance baseline rollover updates five mutant source hashes plus the dependent manifest and synthetic-fixture fingerprints without changing mutant definitions, workloads, thresholds, or profile membership.
            - The safety-analysis performance correction refreshes only its two governed deep-quality mutant source hashes plus the dependent manifest and synthetic-fixture fingerprints; mutant definitions, tests, workloads, thresholds, and profile membership remain unchanged.
    documentation_only: false
    internal_implementation: true
required_verification:
    - name: Deterministic preflight
      command: Run exact clean-source Local and Pull Request profiles on the frozen candidate.
      expected_result: Local 38/38, Pull Request 80/80, architecture 33/33, strict real-engine audit zero, and no failed, unavailable, incomplete, or unaccounted operation. The added shared artifact gate is required; historical 37/79 results are not reusable.
    - name: Full profile
      command: After later owner idle-host confirmation, run one canonical Full 1.30.0 profile through the supported WSL controller and baseline-authenticated native Windows performance path after deterministic preflight.
      expected_result: All required deterministic, runtime, deep-quality, security, release-supply-chain, and governed performance/resource operations pass with only the accepted VSCE license waiver.
    - name: Release profile
      command: After green Full 1.30.0, run the governed production launcher in a separate clean worktree for a no-reuse Release 1.30.0 profile at the same source SHA.
      expected_result: Independent no-reuse Release evidence passes with zero failed, unavailable, or incomplete operations and only the accepted VSCE license waiver.
    - name: Final adversarial proof and waiver review
      command: Validate the final exact-engine artifact, current checked-in zero-finding ratchet, and active waiver registry.
      expected_result: All 148 historical findings remain resolved; 41 programs, 95 subjects, 1,531 executions, and 1,129 comparisons have zero findings; WVR-SEC-VSCE-LICENSE-001 is the sole unchanged waiver.
    - name: Signed local attestation and cloud integrity verification
      command: Construct and sign the deterministic Full/Release evidence root locally, then verify the bundle in cloud CI with the trusted-base verifier.
      expected_result: Exact source/profile/invocation/runtime/sample/waiver bindings pass; stale, fabricated, missing, altered, or untrusted evidence fails closed; cloud performs no expensive recomputation.
    - name: Repository closure
      command: Run governance, generated-artifact, public-contract, documentation, formatting, and patch-integrity checks after recording certification.
      expected_result: The campaign record is complete, P20-T02 is activated but not started, the exact local closure SHA is committed, and the worktree is clean; no push is authorized.
invariant_inventory:
    - invariant_id: single-source-hardened-certification
      architectural_claim: Deterministic, exact-engine, Full, and independent no-reuse Release evidence all authenticate one clean Fourth Edition source baseline before publication preparation resumes.
      authoritative_source: toolchain.json, governance/release-policy.json, governance/certification-profiles.md, and docs/releasing.md
      positive_allowed_form: Local and Pull Request pass first; Full then Release pass at the same clean SHA with exact runtimes, governed samples, complete evidence, and only accepted waivers.
      forbidden_form: Sampling before a known deterministic failure is fixed, ambient runtime substitution, evidence transfer between candidates, retry after a sampled failure on an unchanged SHA, missing/incomplete operation, new waiver, publication action, or mixed source identity.
      mechanical_detection_method: Canonical profile artifacts, structured product-certification projections, exact-runtime evidence, performance sample-consumption state, waiver registry validation, and clean Git identity checks.
      current_observed_state: The interrupted Full at be811599 passed 123 operations, retained only WVR-SEC-VSCE-LICENSE-001, made performance unavailable solely on the Windows 26200.9445 versus 26200.9457 identity mismatch, and proved zero authenticated samples and zero coordinates started in structured invocation d070493b417242ab8b28becefba4b56f. The immutable .9445 baseline is archived at history/dffac2d05330d2e2cd19edc3d9427bc95b12bb93e5b3cc7b16450e20841a98d0. Native qualification found only OS-build and attestation-fingerprint drift. Clean calibration source 36d13f24bcf0c182cb926b2f669c7650747fdd64 passed all 54 old-contract comparisons after source-bound artifact validation, error-only binary-size containment, and exact validated-profile snapshot reuse. Active baseline a0f0ab5f3da117efaa6fd907e5696bb865ecba8376ddbd82f714d8adbf32a7cd now authenticates environment 07046a769a2618588399efd80156976d88f6fcb38886160c542d6757c836e14f and manifest 962897b9c1e5f2a908ab58adcc49473176ca46a86b1edae95f2cda37957070e0. A clean post-adoption native qualification reproduces the active environment. The authoritative Local at 03ab81b passed 36 of 37 operations and made only deep_quality_local_certification@repository incomplete because five intentional rollover source changes retained their be811599 deep-quality hashes; no Pull Request or Full profile started and no authenticated Full sample was consumed. Canonical refresh and isolated Local, Pull Request, and Full deep-quality proofs are green, but tracked authority changed, so the next authoritative campaign must restart Local, then Pull Request, then Full; Release remains separate and forbidden until Full is inspected. The authoritative Local 37/37 and Pull Request 79/79 at df7ff737 then reached Full, which traversed all 125 operations and recorded 121 passed, two failed, one waived, and one unavailable without starting a coordinate or authenticating a sample. Both failures were repository defects and are now corrected. The Perl build regenerates its own generated Makefile from Makefile.PL before invoking make, and the C adapter no longer recursively globs Cargo build trees to declare its interop dependencies, which returns the governed deep-quality sanitizer cases from roughly nineteen minutes each to about seventy-five seconds each inside the unchanged 3600-second budget. The performance unavailability was the designed fail-closed native conditioning result and needed no repository change. Tracked files changed again, so the next authoritative campaign must restart Local, then Pull Request, then Full.
      expected_ratchet: The exact hardened source baseline is immutable evidence for P20-T02; any later semantic-core change requires a new certification event.
