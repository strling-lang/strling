required_verification:
    - name: Locked dependency and release-policy projections
      command: python -m tooling.dependency_lock_verification --check && python tooling/release_policy.py --check
      expected_result: Only the independently versioned private adapter changes and the lock and policy projections verify.
    - name: Archived source replay and canonical browser adapter
      command: bindings/lab-wasm/build-from-source.ps1 followed by bindings/lab-wasm/verify-browser-artifact.mjs
      expected_result: Separate replay workspaces and registry seeds produce identical raw Wasm that passes the released compiler comparison and resource checks.
    - name: Exact-source hosted development qualification
      command: .github/workflows/development-qualification.yml
      expected_result: The hosted Windows replay matches the reviewed artifact and both development matrices pass.
checkpoints:
    - name: Private source and artifact qualification
      status: in_progress
      evidence:
          - check: Build path sensitivity
            result: passed
            details: The same Git source and locked package bytes reproduced when staged at a canonical path. Relocated Windows builds changed Wasm function and data layout.
          - check: Production distribution admission
            result: not_run
            details: Preview support, immutable destination, signed certification and protected publication require separate release-owner approval.
