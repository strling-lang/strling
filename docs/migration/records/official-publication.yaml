                reader, then freeze and freshly certify the successor. No waiver, Preview promotion, public upload or trust-authority
                rotation is authorized.
          - check: Strict wire correction and independent focused proof
            result: passed
            details:
                Two regressions failed before the correction;132registry tests now pass. The affected offline subsystem
                passed375tests and76subtests, with one Windows capability skip requiring Linux coverage. Exact live Moo metadata
                now yields the same author/name/distribution/version/download URL as the flat convenience lookup; the empty
