          - check: Immutable reader qualification and original evidence replay
            result: passed
            details:
                "Reader 68bce447442fd59ac6a1046c48532adc6562ac12 accepted all thirteen stages across all24existing
                test files. linux: 711 passed, 1 warning, 205 subtests passed in 750.07s (0:12:30); windows: 708 passed, 3
