change_classification:
    semantic_change:
        level: none
        evidence:
            - Compiler semantics, API shapes, diagnostics and target behavior remain governed by existing contracts.
    public_api_change:
        level: none
        evidence:
            - Compiler semantics, API shapes, diagnostics and target behavior remain governed by existing contracts.
    schema_change:
        level: compatible
        evidence:
            - Register external-review as a credential mode for deferred ConanCenter deployment.
            - Account explicitly for the owner's initial 4.0.0 public scope without removing any controlled implementation obligation.
    diagnostic_change:
        level: none
        evidence:
            - Compiler semantics, API shapes, diagnostics and target behavior remain governed by existing contracts.
    target_behavior_change:
        level: none
        evidence:
            - Compiler semantics, API shapes, diagnostics and target behavior remain governed by existing contracts.
    architecture_change:
        level: intentional-correction
        evidence:
            - Correct the shared JVM package identity to the owner-verified io.github.strling-lang namespace; adapter responsibility
              remains unchanged.
            - Preserve only exact previously accepted closed certificates through a separately scoped immutable-history check;
              keep current-source waiver and certification checks fail-closed and preserve the original signing authority.
            - Restore original certified package bytes through a protected, read-only hosted export; independently authenticate
              the candidate certificate, its original nested package certificate and the complete artifact graph before export.
    generated_output_change:
        level: compatible
        evidence:
            - Reconcile Maven dependency metadata, version probes, reviewed command hashes and registered projections through
              their owning authorities.
    documentation_only: false
    internal_implementation: true
required_verification:
    - name: Focused source-helper and documentation regressions
      command: python3 -m pytest -q tooling/tests/test_documentation_integrity.py
      expected_result: Source-backed examples and scope assertions reject drift; canonical source frontends remain authoritative.
    - name: Fresh complete-product certification
      command: python3 tooling/production_certification.py --profile release --all --no-reuse --plain
      expected_result:
          Fresh current-source Local, Pull Request, Full and independent no-reuse Release, staged builds/consumers,
          independent reconstruction, restricted signing and hosted verification all pass.
title: Official publication preparation and independent public verification
status: in_progress
objective:
    Correct verified Maven coordinates, preserve direct C++ developer distribution while deferring ConanCenter,
    qualify the publisher and certify an exact source before separately approved publication.
checkpoints:
    - name: Trusted-reader and renewed-waiver reconciliation
      status: in_progress
      evidence:
          - check: Preserve completed 29fc1db4 source-bound profiles
            result: passed
            details:
                Local 38/38, Pull Request 80/80, Full and independent no-reuse Release each 124 passed plus the sole authorized
                waiver. Their results remain bound to 29fc1db4. Original readers rejected the new credential-mode schema and
                renewed waiver record before signing; all terminal evidence is retained.
          - check: Preserve original closed acceptance
            result: passed
            details:
                Hosted run 43496556523 at da4539f5 completed all four jobs successfully on 2026-11-13. Preserve its exact
                source, signatures and producer objects without presenting historical waiver acceptance as current certification.
          - check: Verify Perl publisher account without publication
            result: passed
            details:
                The existing PAUSE session authenticated STRLING. The STRling% permissions query found no namespace records;
                record the verified uploader and retain first-upload indexing and collision checks as explicit dependencies.
    - name: Fresh source certification
      status: in_progress
      evidence:
          - check: Correct active publication task
            result: not_run
            details:
                Local at 117794cb failed governance because the previous completed task remained active; preserve that
                result and register this publication scope.
    - name: Immutable predecessor reader qualification
      status: passed
      evidence:
          - check: Qualify c8f629ef without private-key access
            result: passed
            details:
                Linux 607 tests and Windows 605 tests, 197 subtests each, all nine independent replay stages passed.
                Both Windows capability skips passed on Linux. This qualification remains bound to c8f629ef;
                subsequent applicability, governance and transport changes require a new frozen reader qualification.
    - name: Applicability and transport focused diagnostic
      status: in_progress
      evidence:
          - check: Preserve full engineering denominator and exact initial publication scope
            result: passed
            details:
                All 17 build routes and 256 controlled obligations remain mandatory. The initial public scope derives
                232 applicable obligations and explicitly accounts for 24 deferred C++ ConanCenter obligations.
                The complete focused Windows diagnostic passed 375 tests and 150 subtests with one known symlink
                capability skip; all registered generator checks and governance passed. These are engineering observations,
                not authoritative certification. Private staging and actual hosted byte export remain unexecuted.
    - name: Successor reader qualification and promotion
      status: in_progress
      evidence:
          - check: Qualify c653d825 without original-authority private-key access
            result: passed
            details:
                Linux 664 tests and Windows 662 tests, 197 subtests each, all eleven independent qualification leaves passed.
                The two Windows capability skips passed on Linux. Current Full/Release reconstruction, both real supply-chain
                bundles, public producer reconstruction, original closed certificates and the 2304-file export graph passed.
                The production signing authority remains unchanged. Promote only this exact immutable reader; the subsequent
                product source still requires fresh source-bound profiles, artifacts, consumers, reconstruction, signing and hosted acceptance.
    - name: Owner-selected Maven token scope
      status: passed
      evidence:
          - check: Preserve the existing repository-scoped Central token pair
            result: passed
            details:
                The owner explicitly chose repository scope for SONATYPE_USERNAME and SONATYPE_PASSWORD. Preserve both
                entries without migration or deletion. Java and Kotlin reference the same intended names only within
                protected release jobs; manual approval, exact source, workflow, artifact and run authorization remain mandatory.
                Organizational OpenPGP generation and custody remain owner-only and are not prerequisites for independent certification.
    - name: Governed reader promotion schema reconciliation
      status: passed
      evidence:
          - check: Register preservation references without weakening historical bindings
            result: passed
            details:
                The architecture schema now registers the immutable global and per-reference preservation verifier fields.
                Original source and original verifier identities remain required; missing, mutable and unknown fields are rejected.
                Governance passed and focused regressions passed 128 tests and 64 subtests. These are engineering checks;
                fresh product certification remains pending for the subsequent frozen source.
    - name: Maven signing compatibility investigation
      status: in_progress
      evidence:
          - check: Verify exact publisher with a synthetic signing-only subkey export
            result: passed
            details:
                Immutable c653d825 tooling signed six Java, Kotlin and shared JVM fixture JAR/POM payloads using only an
                RSA4096 signing-subkey secret export. Independent public-certificate verification confirmed subkey and
                primary binding, exact payload bytes, unavailable-primary rejection and wrong-passphrase rejection.
                No production identity, credential access, registry request or publication occurred. Sonatype's current
                primary-key guidance conflicts with assuming Portal acceptance; key creation remains on compatibility hold.
                The approved offline-primary custody architecture is unchanged, pending explicit Portal compatibility evidence
                or an owner-approved alternative. Independent certification does not require a production Maven identity.
    - name: LuaRocks authenticated ownership verification
      status: in_progress
      evidence:
          - check: Verify existing account ownership and module administration
            result: passed
            details:
                The authenticated strling-lang session shows ownership of the existing strling module and permits opening
                its edit page. No field or publishing grant was changed. The profile and edit pages expose no numeric uploader
                identity; retain that exact authorization field as pending rather than inferring it from random DOM identifiers.
    - name: Owner-approved Maven primary signing architecture
      status: in_progress
      evidence:
          - check: Supersede the signing-subkey compatibility hold explicitly
            result: passed
            details:
                The owner authorized a dedicated organizational primary signer shared by Java and Kotlin. RSA4096,
                SHA-256 detached signatures, one-year initial validity and passphrase-protected release environment secrets
                replace the offline-primary/subkey design. The online primary custody distinction is documented.
                Repository-scoped Maven credentials remain unchanged. The exact publisher rejects subkey selection,
                expired or revoked keys, weak or non-RSA keys, unavailable secrets and differing distribution fingerprints.
          - check: Qualify production identity without public publication
            result: passed
            details:
                Restricted local generation, encrypted recovery restoration and revocation restoration passed.
                Twelve synthetic Java, Kotlin and JVM artifact signatures verified independently against the public
                primary certificate with SHA-256 and unchanged payloads. Protected release signing secret writes succeeded.
                Public fingerprint and nonsecret metadata are retained in the campaign provisioning receipt.
                The separately authorized public certificate was distributed through keyserver.ubuntu.com and independently
                retrieved; its normalized public identity exactly matched the approved certificate. Paper custody and
                off-device transfer remain pending owner confirmation; the owner will physically transfer the prepared copy.
                No public package, tag, registry upload or production publication workflow was executed.
    - name: Preserve first primary-signing candidate security failure
      status: in_progress
      evidence:
          - check: Resolve tracked synthetic fixture credential without weakening policy
            result: passed
            details:
                Local at 1391bc21 stopped at security_content_workflows, operation 4 of 38, because the new Maven test
                contained a literal synthetic passphrase. Preserve that exact failed profile and producer output.
                Replace the fixture literal with cryptographic random generation; the tracked-secret rule remains unchanged.
                Run direct content and dependency-integrity checks before freezing the successor source. The real protected
                Maven key and encrypted recovery material were not involved and require no regeneration.
    - name: Bounded-command fixture startup synchronization
      status: in_progress
      evidence:
          - check: Preserve the source-bound PR result and reproduce its startup race
            result: passed
            details:
                Local at 1336efa0 passed 38 operations. PR stopped at repository tests, operation 73 of 80, with
                2521 passed tests and 4214 passed subtests; one process-termination fixture timed out before emitting its
                required output. A controlled 0.75-second startup delay reproduces the same missing-output assertion
                under the unchanged 0.5-second command timeout. Preserve both the original failure and this diagnostic.
          - check: Keep process safety assertions independent from fixture startup
            result: passed
            details:
                Synchronize fixture readiness after descendant creation and both flushed output streams; test ordinary
                startup and startup slower than the command timeout. Keep the production implementation, 0.5-second
                timeout and descendant-termination assertion unchanged. A separate case checks timeout and process
                termination before any readiness output. Ten repeated executions passed on each platform, and all 50
                affected component tests passed on Linux. Forced slow startup remains covered. An initial diagnostic
                harness used a DrvFS temporary directory and failed before collection; preserve those original logs
                separately from the successful native-temporary-directory runs. Production process handling is unchanged.
