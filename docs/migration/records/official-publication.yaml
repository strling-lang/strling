    architecture_change:
        level: intentional-correction
        evidence:
            - Correct the shared JVM package identity to the owner-verified io.github.strling-lang namespace; adapter responsibility
              remains unchanged.
            - Preserve only exact previously accepted closed certificates through a separately scoped immutable-history check;
              keep current-source waiver and certification checks fail-closed and preserve the original signing authority.
            - Restore original certified package bytes through a protected, read-only hosted export; independently authenticate
              the candidate certificate, its original nested package certificate and the complete artifact graph before export.
    generated_output_change:
        level: compatible
        evidence:
            - Reconcile Maven dependency metadata, version probes, reviewed command hashes and registered projections through
              their owning authorities.
    documentation_only: false
    internal_implementation: true
required_verification:
    - name: Focused source-helper and documentation regressions
      command: python3 -m pytest -q tooling/tests/test_documentation_integrity.py
      expected_result: Source-backed examples and scope assertions reject drift; canonical source frontends remain authoritative.
    - name: Fresh complete-product certification
      command: python3 tooling/production_certification.py --profile release --all --no-reuse --plain
      expected_result:
          Fresh current-source Local, Pull Request, Full and independent no-reuse Release, staged builds/consumers,
          independent reconstruction, restricted signing and hosted verification all pass.
title: Official publication preparation and independent public verification
status: in_progress
objective:
    Correct verified Maven coordinates, preserve direct C++ developer distribution while deferring ConanCenter,
    qualify the publisher and certify an exact source before separately approved publication.
checkpoints:
    - name: Trusted-reader and renewed-waiver reconciliation
      status: in_progress
      evidence:
          - check: Preserve completed 29fc1db4 source-bound profiles
            result: passed
            details:
                Local 38/38, Pull Request 80/80, Full and independent no-reuse Release each 124 passed plus the sole authorized
                waiver. Their results remain bound to 29fc1db4. Original readers rejected the new credential-mode schema and
                renewed waiver record before signing; all terminal evidence is retained.
          - check: Preserve original closed acceptance
            result: passed
            details:
                Hosted run 43496556523 at da4539f5 completed all four jobs successfully on 2026-11-13. Preserve its exact
                source, signatures and producer objects without presenting historical waiver acceptance as current certification.
          - check: Verify Perl publisher account without publication
            result: passed
            details:
                The existing PAUSE session authenticated STRLING. The STRling% permissions query found no namespace records;
                record the verified uploader and retain first-upload indexing and collision checks as explicit dependencies.
    - name: Fresh source certification
      status: in_progress
      evidence:
          - check: Correct active publication task
            result: not_run
            details:
                Local at 117794cb failed governance because the previous completed task remained active; preserve that
                result and register this publication scope.
    - name: Immutable predecessor reader qualification
      status: complete
      evidence:
          - check: Qualify c8f629ef without private-key access
            result: passed
            details:
                Linux 607 tests and Windows 605 tests, 197 subtests each, all nine independent replay stages passed.
                Both Windows capability skips passed on Linux. This qualification remains bound to c8f629ef;
                subsequent applicability, governance and transport changes require a new frozen reader qualification.
    - name: Applicability and transport focused diagnostic
      status: in_progress
      evidence:
          - check: Preserve full engineering denominator and exact initial publication scope
            result: passed
            details:
                All 17 build routes and 256 controlled obligations remain mandatory. The initial public scope derives
                232 applicable obligations and explicitly accounts for 24 deferred C++ ConanCenter obligations.
                The complete focused Windows diagnostic passed 375 tests and 150 subtests with one known symlink
                capability skip; all registered generator checks and governance passed. These are engineering observations,
                not authoritative certification. Private staging and actual hosted byte export remain unexecuted.
