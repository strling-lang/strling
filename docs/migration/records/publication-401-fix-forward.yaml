                weakening, new waiver or trusted-reader change is involved. Freeze a successor
                and run every complete authoritative profile afresh after dependent checks pass.
          - check: Grouped Local repair qualification
            result: passed
            details: >-
                The follow-up diagnostic passed the complete repository formatter, hygiene and
                linter checks plus 217 targeted tests and 13 subtests. It accounts for all 18
                previously unexecuted Local leaves together with the unchanged passing Rust,
                interop and type checks. These are engineering observations only: no accepted
