                substitute for any complete fresh Local, PR, Full or independent Release profile.
          - check: Preserved source-bound Local and final PR failure
            result: failed
            details: >-
                Source 4f002556169501505260f5c1dcd2f9f4fc2c4ca7 passed fresh Local 38/38,
                then failed PR only at test@typescript (79 passed, 1 failed /80). Its
                test searched the correctly assembled 4.0.1 WASM for a literal 4.0.0
