change_classification:
    semantic_change:
        level: none
        evidence: &id001
            - No compiler semantics, public API, target behavior or supported-platform
              expansion. Packaging and publisher implementation changes produce a new
              4.0.1 source; certified a58f126b and its original 4.0.0 artifacts remain historical.
    public_api_change:
        level: intentional-correction
        affected_surfaces:
            - c-public-api
            - cpp-public-api
            - csharp-public-api
            - fsharp-public-api
            - php-public-api
        evidence:
            - Project the owner-authorized 4.0.1 product identity into public package and
              native adapter version surfaces. Public API shapes and compiler semantics
              remain unchanged; the new source requires fresh certification.
            - The exact comparator classifies the C/C++ package-version literals, C#/FSharp
              assembly-version identities and PHP VERSION constant as breaking snapshot drift.
              Only those five reviewed 4.0.0-to-4.0.1 projections are declared as an intentional
              correction; snapshot comparison, exact surface accounting and all other checks
              remain enforced. No public signature, type shape or compiler behavior changes.
    diagnostic_change:
        level: none
        evidence: *id001
    target_behavior_change:
        level: none
        evidence: *id001
    generated_output_change:
        level: intentional-correction
        evidence:
            - Owner-authorized product 4.0.1 projections and regenerated exact policy/lock/fixture
              outputs; historical source and signed evidence remain unchanged.
    schema_change:
        level: intentional-correction
        evidence:
            - Bind future acceptance to the exact 4.0.1 product authority without weakening
              version, source or completeness checks.
    architecture_change:
        level: intentional-correction
        evidence:
            - Repair real registry semantics, public file graph, audited Linux wheel transport
              and safe subprocess diagnostics. Preserve kernel semantics and support classifications.
    documentation_only: false
    internal_implementation: true
required_verification:
    - name: contract
      command:
          Registered version, release-policy, generated-artifact, public-distribution,
          package and trust checks
      expected_result:
          Exact 4.0.1 projections with unchanged trust authorities and support
          boundaries.
    - name: unit
      command:
          Affected positive and adversarial Windows/Linux tests and actual-client
          nonpublishing protocol qualification
      expected_result: No deterministic registry/toolchain prerequisite remains unresolved.
    - name: integration
      command:
          Fresh 17-route distribution builds, independent comparisons and applicable
          consumers; Local, Pull Request, Full and no-reuse Release; independent reconstruction/signing/hosted
          acceptance
      expected_result:
          All registered required operations pass or retain only the exact
          authorized existing waiver.
    - name: quality
      command: Governed security, licensing, architecture, lint and formatting checks
      expected_result: No new waiver or unbounded dependency/platform claim.
checkpoints:
    - name: Preserve partial 4.0.0 release and approve fix forward
      status: passed
      evidence:
          - check: owner authority and incident
            result: passed
            details:
                "Owner explicitly authorized 4.0.1 engineering and fresh certification
                only. 43803833092/2: nine publishers succeeded, five failed, two untouched jobs
                cancelled safely; original package bytes, tags, signatures, receipts and public
                retrievals preserved."
    - name: Focused registry protocol repairs
      status: passed
      evidence:
          - check: initial direct regressions
            result: passed
            details:
                73 focused tests passed for CPAN absent envelopes, Lua authenticated
                nil/null responses and distinct private npm config files. Further packaging
                and safe-error diagnostics remain.
          - check: Grouped fix-forward engineering qualification
            result: passed
            details:
                Windows focused diagnostics passed 308 tests; a byte-verified native
                Linux snapshot passed 491 tests and 292 subtests. Final targeted
                source checks passed 97 tests and 91 subtests, followed by 90 tests
                and 13 subtests for the final guarded publisher/consumer changes.
                These are overlapping engineering suites, not certification totals.
          - check: Actual nonpublishing package and client checks
            result: passed
            details:
                Fresh Windows and Linux Python engineering builds and isolated
                staged consumers passed. The Linux wheel passed auditwheel 6.8.2
                before and after manylinux_2_34 tagging with unchanged payload bytes.
                Pinned npm 11.5.1 reproduced the old duplicate-config failure and
                passed the corrected configuration. Pub dry-run selected exactly
                eight payload files without .pubignore. JDK 11/21 source-bound
                bridge identities were reviewed; Kotlin generation changed no
                third-party entries. All public API snapshots regenerated; five
                changed only product/assembly version identities. Eighteen reviewed
                installation examples changed only coordinates. Canonical LSP
                assembly passed. Frozen-source preparation must be repeated where
                the generated manifest binds its exact commit.
          - check: Ruby historical diagnostic boundary
            result: passed
            details:
                The original server-side refusal cannot be reconstructed because
                stderr was not retained. Preserve that uncertainty. The revised
                adapter requires the explicit short-lived protected identity and
                retains bounded credential-redacted command errors; synthetic
                refusal and no-fallback checks pass. No production retry occurred.
          - check: RubyGems automatic-client behavior
            result: passed
            details:
                Hash-verified official RubyGems 4.1.0 source and synthetic request
                callbacks demonstrate automatic sigstore-cli installation/signing
                when its child retains GITHUB_ACTIONS. The uploader now pins and
                verifies that client, uses only its exchanged scoped gem credential,
                and removes unused GitHub/OIDC credentials from that child only.
                Parent authorization and protected attestation remain enforced.
                No production signing or upload was used as a test. This does not
                establish the original server-side refusal's cause.
          - check: CPAN archive versus normalized metadata version
            result: passed
            details:
                An actual disposable 4.0.1 archive has META.json version v4.0.1.
                Official MetaCPAN indexer revision cbdebb4d01ab71407465595ad2d54bb63fbaee4c
                derives the release version with fix_version, which prefixes v for
                three-part versions and drops a prerelease suffix. The reader now
                checks this exact normalized value while preserving complete archive
                coordinates, owner identity and authenticated byte checks. Regression
                cases reject alternate metadata and stable-for-prerelease substitution.
                This reader change requires a new immutable qualification source;
                the retained e8e70f81 qualification cannot certify the successor.
    - name: Freeze and independently certify 4.0.1
      status: blocked
      evidence:
          - check: Initial frozen canonical preparation
            result: failed
            details: >-
                Source 89d460704d212bf77efb63fe6c612ecaaa97e841 passed setup, native interop,
                source-bound LSP assembly and 41 generated families. Public snapshot checking
                reproduced an incomplete migration declaration: all 26 snapshots matched, but
                five version-only surface changes were unnamed and classified incorrectly.
                Original preparation and direct diagnostic failures are retained; no authoritative
                profile or fresh distribution build started for that source. Correct the declaration
                and freeze a successor without changing snapshots, the comparator or trust policy.
          - check: Successor canonical preparation and license preflight
            result: failed
            details: >-
                Source c0d638461d4dc9846ae44b53ee45d216d688aab4 passed all 42 generated
                families, governance and 42 Maven/documentation tests. Its non-authoritative risk
                preflight retained 53 passes, the existing VSCE waiver and one blocked unknown
                license classification for newly locked pyelftools 0.33. No authoritative profile
                or fresh distribution build had started. The exact official archive and all ten
                bundled Construct files were independently checked; preserve the Unlicense and
