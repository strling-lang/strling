change_classification:
    semantic_change:
        level: none
        evidence:
            - Canonical compiler semantics and all versioned language contracts are preserved.
    public_api_change:
        level: breaking
        evidence:
            - The ratified major product version activates 4.0.0 package constants and dependency coordinates; adapters
              reject older or mismatched product kernels. WASM direct instance construction is retired in favor of
              factories that bind verified modules to instances.
        affected_surfaces:
            - c-public-api
            - cpp-public-api
            - csharp-public-api
            - fsharp-public-api
            - java-public-api
            - kotlin-public-api
            - php-public-api
            - typescript-public-api
    schema_change:
        level: breaking
        evidence:
            - Release manifest and build receipts advance to 2.0.0 with mandatory distribution scope, version binding,
              and package payload contracts. Historical H08 contracts remain unchanged.
        affected_surfaces: []
    diagnostic_change:
        level: none
        evidence:
            - Canonical diagnostic codes and payloads are unchanged.
    target_behavior_change:
        level: none
        evidence:
            - No target profile or runtime support guarantee is expanded.
    architecture_change:
        level: compatible
        evidence:
            - Host adapters retain one canonical compiler. Product compatibility data adds no native export or protocol
              field. The independent packaging trust context preserves the original H08 trust policy and bundle.
    generated_output_change:
        level: compatible
        evidence:
            - Registered version, package graph, policy, source identity and contract projections require canonical
              regeneration; reviewed dependency catalog refresh remains an explicit integrity-authority change.
    documentation_only: false
    internal_implementation: true
required_verification:
    - name: Focused package and publication boundaries
      command:
          python3 -m pytest -q tooling/tests/test_sync_versions.py tooling/tests/test_release_supply_chain.py
          tooling/tests/test_release_publication_authorization.py tooling/tests/test_release_packaging_security.py
          tooling/tests/test_release_payload.py
      expected_result:
          Metadata, artifact substitution, unsafe archives, wrong source/version/owner, untrusted context
          and missing Release evidence fail closed.
    - name: Fresh clean-source deterministic certification
      command: ./strling profile full --json && ./strling profile release --json
      expected_result:
          Fresh Full and independent no-reuse Release pass on frozen source; packaging subjects have
          complete reproducibility and consumer evidence; publication remains disabled.
checkpoints:
    - name: Scope and contract lock
      status: passed
      evidence:
          - check: Baseline identity
            result: passed
            details:
                Started on clean dev at 2d8d897504663211d3768517f0be9f0e28d0f11e; seventeen distribution surfaces
                and exact support tiers recorded in the implementation report.
    - name: Contracts and verification design
      status: passed
      evidence:
          - check: Adversarial guards
            result: passed
            details:
                Schema 2.0 locks all seventeen distribution identities, twenty-one platform build rows, forty-two
                receipts and ninety-five tool coordinates. Exact source, owner/run/destination approval, hidden-file
                artifact handoff and protected credential isolation are validated. Historical H08 authority and deterministic
                profile boundaries remain preserved.
    - name: Implementation and targeted proof
      status: in_progress
      evidence:
          - check: Local package proof
            result: passed
            details:
                Pinned CPython 3.12 Linux sdist/wheel content inspection, Dart dry-run with zero warnings, Windows
                C#/F# packages and two isolated consumers, Node 22 WASM tests, and governed Linux Go/Dart/Swift parity/probes
                pass. These are engineering observations, not public installations or clean-source certification.
    - name: Full integration and certification
      status: planned
      evidence: []
    - name: Finalization and readiness
      status: planned
      evidence: []
