          historical failures and closed H08.
        - Completed all 17 governed 4.0.0 distribution routes with reproducible assembly, complete supply-chain
          evidence and protected exact-artifact dry-run publication.
        - Closed fresh current-source Local, PR, Full and independent no-reuse Release, independent reconstruction,
          original-key signing and hosted integrity.
    verified:
        - Local 37/37 and PR 79/79; Full and independent Release each 123 passed and the sole existing waiver
          /124, with zero failed, unavailable or incomplete requirements.
        - All 42 receipts, 21 platform comparisons, 95 tool coordinates, 17 exact handoffs, SPDX 2.3/SLSA graphs
          and offline Python sdist reconstruction verify at 021239608ffa5066e59bdebde9869e193fbb3eab.
        - Original-key evidence root 19533d8d1de2248367616df5a6a6782156125efefe6c8e3be47e316ed7c0d2b0; hosted
          integrity https://github.com/strling-lang/strling/actions/runs/42810405265.
    behavior_changed:
        Product packages and compatibility metadata project canonical 4.0.0; release automation
        validates and publishes only owner-authorized exact certified artifacts. Canonical compiler semantics
        remain unchanged.
    intentional_behavior_changes:
        - Fourth Edition package identities require exact matching product kernels.
        - Direct WASM instance construction is retired in favor of factories binding verified modules to instances.
    preserved_behavior:
        - One canonical compiler and reference kernel, specification sovereignty, existing target/runtime scopes
          and all Supported/Preview distinctions.
        - Closed H08 evidence and trust authority, deterministic certification and the sole existing WVR-SEC-VSCE-LICENSE-001
          within its authorized scope.
        - Certification never authorizes publication; protected owner approval and external registry/account
          prerequisites remain required.
    transitional_architecture: []
    deferred_work:
        - External account ownership, trusted-publisher and protected production-credential configuration, actual
          publication, production tags, GitHub Releases and public-registry installation verification belong
          to separately authorized release work.
