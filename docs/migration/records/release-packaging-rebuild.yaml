change_classification:
    semantic_change:
        level: none
        evidence:
            - Canonical compiler semantics and all versioned language contracts are preserved.
    public_api_change:
        level: breaking
        evidence:
            - The ratified major product version activates 4.0.0 package constants and dependency coordinates;
              adapters reject older or mismatched product kernels. WASM direct instance construction is retired
              in favor of factories that bind verified modules to instances.
        affected_surfaces:
            - c-public-api
            - cpp-public-api
            - csharp-public-api
            - fsharp-public-api
            - php-public-api
            - rust-public-api
            - typescript-public-api
    schema_change:
        level: breaking
        evidence:
            - Release manifest and build receipts advance to 2.0.0 with mandatory distribution scope, version
              binding, and package payload contracts. Historical H08 contracts remain unchanged.
        affected_surfaces: []
    diagnostic_change:
        level: none
        evidence:
            - Canonical diagnostic codes and payloads are unchanged.
    target_behavior_change:
        level: none
        evidence:
            - No target profile or runtime support guarantee is expanded.
    architecture_change:
        level: compatible
        evidence:
            - Host adapters retain one canonical compiler. Product compatibility data adds no native export or
              protocol field. The independent packaging trust context preserves the original H08 trust policy
              and bundle.
    generated_output_change:
        level: compatible
        evidence:
            - Registered version, package graph, policy, source identity and contract projections require canonical
              regeneration; reviewed dependency catalog refresh remains an explicit integrity-authority change.
    documentation_only: false
    internal_implementation: true
required_verification:
    - name: Focused package and publication boundaries
      command:
          python3 -m pytest -q tooling/tests/test_sync_versions.py tooling/tests/test_release_supply_chain.py
          tooling/tests/test_release_publication_authorization.py tooling/tests/test_release_packaging_security.py
          tooling/tests/test_release_payload.py
      expected_result:
          Metadata, artifact substitution, unsafe archives, wrong source/version/owner, untrusted
          context and missing Release evidence fail closed.
    - name: Fresh clean-source deterministic certification
      command:
          ./strling profile full --json && python3 tooling/production_certification.py --profile release
          --all --no-reuse --plain
      expected_result:
          Fresh current-source Full and independent no-reuse Release are accepted with 123 passed
          and the sole existing license waiver out of 124 requirements; all packaging subjects, reconstruction
          and signatures verify; publication remains disabled.
