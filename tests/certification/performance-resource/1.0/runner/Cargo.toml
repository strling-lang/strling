[package]
name = "strling-performance-runner"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0"
publish = false

[workspace]

[features]
default = ["full-runner"]
full-runner = ["dep:strling", "dep:strling-interop"]
# Qualification build of the actual worker; its distinct contract cannot certify.
resident-memory-audit = []
# Deliberately doubles measured work; raw reports identify this negative control.
workstation-slowdown-challenge = []

[dependencies]
serde_json = "1.0"
strling = { path = "../../../../../", optional = true }
strling-interop = { path = "../../../../../bindings/interop", optional = true }
strling-kernel = { path = "../../../../../core/internal" }

[[bin]]
name = "strling-performance-runner"
path = "src/main.rs"
required-features = ["full-runner"]

[[bin]]
name = "strling-performance-memory-worker"
path = "src/memory_worker.rs"

[profile.release]
codegen-units = 1
lto = "thin"
